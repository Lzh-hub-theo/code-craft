spring:
  application:
    name: yu-ai-code-user

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 1234

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600

  # session config
  session:
    store-type: redis
    # session expire in 30 days
    timeout: 2592000

server:
  port: 8124
  servlet:
    context-path: /api
    # cookie expire in 30 days
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yu.ai.yuaicodemother.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn